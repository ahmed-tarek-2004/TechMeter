<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .pdf-card {
            display: flex;
            align-items: center;
            gap: 18px;

            padding: 20px;

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .pdf-icon {
            width: 60px;
            height: 70px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;

            background: #ef4444;
            color: white;

            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;
        }

        .pdf-info {
            flex: 1;
        }

        .pdf-info h2 {
            margin-bottom: 6px;

            color: #111827;

            font-size: 18px;
        }

        .pdf-info p {
            color: #6b7280;

            font-size: 14px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            background: #111827;
            color: white;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .download-btn:hover {
            background: #374151;

            transform: translateY(-1px);
        }

        .download-icon {
            font-size: 18px;
        }

        @media (max-width: 600px) {

            .pdf-card {
                flex-wrap: wrap;
            }

            .pdf-info {
                min-width: calc(100% - 80px);
            }

            .download-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="pdf-card">

            <div class="pdf-icon">
                PDF
            </div>

            <div class="pdf-info">

                <h2>
                    Git Branching & Commit Guide
                </h2>

                <p>
                    PDF Document
                </p>

            </div>

            <a
                class="download-btn"
                href="https://res.cloudinary.com/dpysq7jwa/raw/upload/v1789413057/lessons/3a75b2ed3aad418794e5b1a751f3c07a.pdf"
            >
                <span class="download-icon">
                    ↓
                </span>

                Download PDF
            </a>

        </div>

    </div>

</body>
</html>
