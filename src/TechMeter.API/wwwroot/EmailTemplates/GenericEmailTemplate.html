<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{Subject}}</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
">

    <table width="100%"
           cellpadding="0"
           cellspacing="0"
           border="0"
           style="
               width: 100%;
               background-color: #f4f7fb;
               padding: 40px 15px;
           ">

        <tr>
            <td align="center">

                <!-- Email Card -->
                <table width="600"
                       cellpadding="0"
                       cellspacing="0"
                       border="0"
                       style="
                           width: 100%;
                           max-width: 600px;
                           background-color: #ffffff;
                           border-radius: 14px;
                           overflow: hidden;
                           box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                       ">

                    <!-- Header -->
                    <tr>
                        <td style="
                            padding: 28px 35px;
                            background-color: #111827;
                        ">

                            <table width="100%"
                                   cellpadding="0"
                                   cellspacing="0"
                                   border="0">

                                <tr>

                                    <!-- Logo -->
                                    <td align="left">
                                        <span style="
                                            color: #ffffff;
                                            font-size: 24px;
                                            font-weight: 700;
                                            letter-spacing: -0.5px;
                                        ">
                                            Tech<span style="color: #60a5fa;">
                                                Meter
                                            </span>
                                        </span>
                                    </td>

                                    <!-- Subject -->
                                    <td align="right">
                                        <span style="
                                            color: #9ca3af;
                                            font-size: 12px;
                                        ">
                                            {{Subject}}
                                        </span>
                                    </td>

                                </tr>

                            </table>

                        </td>
                    </tr>


                    <!-- Blue Accent -->
                    <tr>
                        <td style="
                            height: 4px;
                            background-color: #3b82f6;
                            font-size: 0;
                            line-height: 0;
                        ">
                            &nbsp;
                        </td>
                    </tr>


                    <!-- Main Content -->
                    <tr>
                        <td style="
                            padding: 38px 35px 30px;
                        ">

                            <!-- Recipient -->
                            <p style="
                                margin: 0 0 22px;
                                font-size: 17px;
                                color: #111827;
                            ">
                                Hello
                                <strong>{{RecipientName}}</strong>,
                            </p>


                            <!-- Sender Information -->
                            <table width="100%"
                                   cellpadding="0"
                                   cellspacing="0"
                                   border="0"
                                   style="
                                       margin-bottom: 28px;
                                       background-color: #f8fafc;
                                       border: 1px solid #e5e7eb;
                                       border-radius: 8px;
                                   ">

                                <tr>
                                    <td style="
                                        padding: 15px 18px;
                                    ">

                                        <p style="
                                            margin: 0 0 6px;
                                            font-size: 12px;
                                            color: #9ca3af;
                                        ">
                                            Message from
                                        </p>

                                        <p style="
                                            margin: 0;
                                            font-size: 14px;
                                            font-weight: 600;
                                            color: #374151;
                                        ">
                                            {{SenderName}}
                                        </p>

                                    </td>
                                </tr>

                            </table>


                            <!-- Dynamic Content -->
                            <div style="
                                font-size: 15px;
                                line-height: 1.8;
                                color: #4b5563;
                            ">

                                {{Content}}

                            </div>


                            <!-- Optional Action Button -->
                            {{ActionButton}}

                        </td>
                    </tr>


                    <!-- Divider -->
                    <tr>
                        <td style="
                            padding: 0 35px;
                        ">

                            <div style="
                                height: 1px;
                                background-color: #e5e7eb;
                            ">
                            </div>

                        </td>
                    </tr>


                    <!-- Footer -->
                    <tr>
                        <td style="
                            padding: 25px 35px;
                            background-color: #f9fafb;
                            text-align: center;
                        ">

                            <p style="
                                margin: 0 0 8px;
                                font-size: 13px;
                                color: #6b7280;
                            ">
                                Need help?
                            </p>

                            <p style="
                                margin: 0 0 12px;
                                font-size: 12px;
                                line-height: 1.6;
                                color: #9ca3af;
                            ">
                                If you have any questions or need
                                assistance, our support team is here
                                to help.
                            </p>

                            <p style="
                                margin: 0;
                                font-size: 11px;
                                color: #9ca3af;
                            ">
                                © 2026 TechMeter. All rights reserved.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
